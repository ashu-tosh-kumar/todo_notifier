[tool.black]
line-length = 160
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | venv
  | \.history
)/
'''

[tool.isort]
profile = "black"
skip = ["migrations", ".env", "venv", ".local", ".history", ".vscode"]

[tool.coverage.run]
source = ["todonotifier"]
branch = false

[tool.coverage.report]
# The package is at 100% line coverage; keep it there (see AGENTS.md).
fail_under = 100

# This project scans itself in CI (`todonotifier scan . --fail-on expired --format github`).
# The tests and their fixtures hold deliberate markers, so they are excluded.
[tool.todonotifier]

[tool.todonotifier.exclude_dirs]
name = ["tests", "sample_reports"]

[tool.poetry]
name = "todonotifier"
version = "2.1.0"
description = "Track TODO and FIXME comments with deadlines and owners. Overdue TODO reminders via CLI, pre-commit hook, GitHub Action, Slack, Teams and email."
authors = ["Ashutosh <37182127+ashu-tosh-kumar@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
keywords = [
    "todo",
    "fixme",
    "todo-comments",
    "technical-debt",
    "code-quality",
    "developer-tools",
    "cli",
    "github-actions",
    "pre-commit",
    "linter",
    "productivity",
    "reminder",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
]
exclude = ["tests", "sample_reports"]

[tool.poetry.urls]
Homepage = "https://pypi.org/project/todonotifier/"
Repository = "https://github.com/ashu-tosh-kumar/todo_notifier"
Documentation = "https://ashu-tosh-kumar.github.io/todo_notifier/"
Changelog = "https://github.com/ashu-tosh-kumar/todo_notifier#changelog"
"Issue Tracker" = "https://github.com/ashu-tosh-kumar/todo_notifier/issues"

[tool.poetry.scripts]
todonotifier = "todonotifier.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
gitpython = "^3.1.0"
python-dateutil = "^2.8.2"
jinja2 = "^3.1.0"
tomli = { version = "^2.0", python = "<3.11" }


[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.6.2,<5.0.0"
black = ">=26.10.1"
flake8 = "^7.0.0"
isort = ">=5.13.2,<7.0.0"
coverage = "^7.4.4"
pdoc = ">=14.4,<16.0"
pytest = "^8.1.1"
twine = "^6.0.1"
jsonschema = ">=4.18,<5"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5,<10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
