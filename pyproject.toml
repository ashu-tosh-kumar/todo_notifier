[tool.black]
line-length = 160
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | venv
  | \.history
)/
'''

[tool.isort]
profile = "black"
skip = ["migrations", ".env", "venv", ".local", ".history", ".vscode"]

[tool.coverage.run]
source = ["todonotifier"]
branch = false

[tool.coverage.report]
# The package is at 100% line coverage; keep it there (see AGENTS.md).
fail_under = 100

# This project scans itself in CI (`todonotifier scan . --fail-on expired --format github`).
# The tests and their fixtures hold deliberate markers, so they are excluded.
[tool.todonotifier]

[tool.todonotifier.exclude_dirs]
name = ["tests", "sample_reports"]

[tool.poetry]
name = "todonotifier"
version = "2.1.0"
description = "Library to setup automatic TODO Notifications in code"
authors = ["Ashutosh <37182127+ashu-tosh-kumar@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://pypi.org/project/todonotifier/"
repository = "https://github.com/ashu-tosh-kumar/todo_notifier"
documentation = "https://ashu-tosh-kumar.github.io/todo_notifier/"
exclude = ["tests", "sample_reports"]

[tool.poetry.scripts]
todonotifier = "todonotifier.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
gitpython = "^3.1.0"
python-dateutil = "^2.8.2"
jinja2 = "^3.1.0"
tomli = { version = "^2.0", python = "<3.11" }


[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.6.2,<5.0.0"
black = [
    { version = ">=26.10.1", python = ">=3.10" },
    { version = ">=24.3,<26.0", python = "<3.10" },
]
flake8 = "^7.0.0"
isort = ">=5.13.2,<7.0.0"
coverage = "^7.4.4"
pdoc = ">=14.4,<16.0"
pytest = "^8.1.1"
twine = "^6.0.1"
jsonschema = ">=4.18,<5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
