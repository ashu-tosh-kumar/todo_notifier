name: website

# Build the documentation (MkDocs Material user guide, plus the pdoc API reference under /api/).
# Pull requests only build it (so a broken link or page shows up in review); pushes to main also deploy it to GitHub Pages.
on:
  push:
    branches:
      - main
    # Alternative: only build for tags.
    # tags:
    #   - '*'
  pull_request:

# Least privilege: the build only reads the repository; the OIDC token (id-token) is for the deploy job alone.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Pull requests have their own groups, so they never block or replace a deployment.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # actions/configure-pages (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Install all dependencies (including MkDocs Material and pdoc)
      - run: pip install poetry; poetry install --with dev,docs

      # The generated reference pages (configuration, CLI flags, languages) must match the code
      - run: poetry run python scripts/gen_docs_reference.py --check

      # Build the user guide into site/. `strict: true` in mkdocs.yml fails the build on a broken link or a missing page.
      - run: poetry run mkdocs build --strict

      # Build the API reference into site/api/ (after mkdocs, which cleans site/ first and ships a placeholder site/api/index.html)
      - run: poetry run pdoc -o site/api --docformat google --logo https://user-images.githubusercontent.com/37182127/233436178-26c2b4be-e630-4f9b-b4c9-d58424bd365d.png todonotifier/

      # Create .nojekyll file to disable Jekyll processing
      - run: touch site/.nojekyll

      # Setup Pages and publish the artifact (pushes to main only)
      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site/

      # On pull requests, keep the built site for a few days so reviewers can download and open it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: site/
          retention-days: 7

  # Deploy the artifact to GitHub pages (never for pull requests).
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
