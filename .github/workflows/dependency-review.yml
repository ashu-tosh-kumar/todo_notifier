# Scans dependency manifest changes on PRs and blocks pull requests that
# introduce known-vulnerable dependencies. Native GitHub action, no external service.
name: Dependency Review

on:
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # black is a dev-only tool; the patched release (26.10.1) needs Python >=3.10 while we still support 3.9
          allow-ghsas: GHSA-3936-cmfr-pm3m,GHSA-cg8m-r9f2-5wm2
