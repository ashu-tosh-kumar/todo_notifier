# Keep the versions of black, flake8 and isort in step with the ones locked in poetry.lock and run by CI (.github/workflows/python-app.yml), so that
# `pre-commit run --all-files` and CI agree. Black and isort read their settings from pyproject.toml, flake8 from tox.ini.
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: [--config=./pyproject.toml]

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: [--config=./tox.ini]

  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: requirements-txt-fixer
      - id: debug-statements
      - id: detect-aws-credentials
      - id: detect-private-key
